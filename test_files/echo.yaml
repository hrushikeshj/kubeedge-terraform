apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api
  labels:
    app: fast-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fast-api
  template:
    metadata:
      labels:
        app: fast-api
    spec:
      #hostNetwork: true
      containers:
      - image: ealen/echo-server:latest
        imagePullPolicy: IfNotPresent
        name: echoserver
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        resources:
          requests:
            cpu: 200m
            memory: 300Mi
          limits:
            memory: 400Mi
      nodeSelector:
       "node-role.kubernetes.io/edge": ""
---
apiVersion: v1
kind: Service
metadata:
  name: fast-api
spec:
  type: NodePort
  selector:
    app: fast-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30000
